services:
  # 감시 루프
  noti:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./config:/config        # config.yaml 이 들어있는 디렉터리
      - noti-data:/data         # SQLite (이미 알린 매물 기록)

  # 설정 페이지. 인증이 없으므로 호스트 루프백에만 노출한다.
  noti-web:
    build: .
    restart: unless-stopped
    env_file: .env
    command: ["noti", "web", "--host", "0.0.0.0", "--port", "8765"]
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - ./config:/config
      - noti-data:/data

volumes:
  noti-data:
