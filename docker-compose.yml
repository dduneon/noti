services:
  # 감시 루프
  noti:
    build: .
    restart: unless-stopped
    env_file: .env
    # env_file 은 이미지의 ENV 를 덮어쓴다. 경로는 여기서 다시 못박아
    # .env 에 낡은 NOTI_CONFIG_PATH/NOTI_DB_PATH 가 있어도 컨테이너가 깨지지 않게 한다.
    environment:
      NOTI_CONFIG_PATH: /config/config.yaml
      NOTI_DB_PATH: /data/noti.db
    volumes:
      - ./config:/config        # config.yaml 이 들어있는 디렉터리
      - noti-data:/data         # SQLite (이미 알린 매물 기록)

  # 설정 페이지. 인증이 없으므로 호스트 루프백에만 노출한다.
  noti-web:
    build: .
    restart: unless-stopped
    env_file: .env
    command: ["noti", "web", "--host", "0.0.0.0", "--port", "8765"]
    environment:
      NOTI_CONFIG_PATH: /config/config.yaml
      NOTI_DB_PATH: /data/noti.db
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - ./config:/config
      - noti-data:/data

volumes:
  noti-data:
