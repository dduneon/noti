# 감시 조건. 이 파일을 config.yaml 로 복사해서 쓰세요.
# 첫 실행에 기존 매물까지 전부 알림받고 싶으면 true
notify_on_first_run: false

targets:
  # 1) 특정 단지 전세 감시
  - name: "○○아파트 전세 9억 이하"
    kind: complex
    complex_no: "111515"        # new.land.naver.com/complexes/111515 의 숫자
    trade_types: ["B1"]          # A1 매매 / B1 전세 / B2 월세
    real_estate_types: ["APT"]
    max_pages: 3
    criteria:
      max_deposit: 90000         # 만원 단위 (9억)
      min_area_m2: 84            # 전용면적 ㎡
      min_floor: 3
      exclude_first_floor: true
      directions: ["남향", "남동향", "남서향"]
      exclude_keywords: ["단기", "반전세"]

  # 2) 구 단위 지역 감시 (하위 동을 자동으로 펼쳐서 전부 훑음)
  - name: "강남구 전세 10억 이하"
    kind: region
    cortar_no: "1168000000"      # `noti find-region 서울 강남구` 로 확인
    expand_subregions: true      # 구/시 코드 → 하위 동 전체 (기본값 true)
    max_subregions: 30           # 동이 너무 많을 때 상한
    trade_types: ["B1"]
    real_estate_types: ["APT", "OPST"]
    max_pages: 2                 # 동마다 최대 2페이지
    criteria:
      max_deposit: 100000
      min_area_m2: 59

  # 3) 동 하나만 콕 집어 월세 감시
  - name: "역삼동 오피스텔 월세"
    kind: region
    cortar_no: "1168010100"      # 동 코드를 주면 그대로 사용
    trade_types: ["B2"]
    real_estate_types: ["OPST"]
    max_pages: 2
    criteria:
      max_deposit: 5000
      max_monthly: 120
      min_area_m2: 33
